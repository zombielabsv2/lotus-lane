name: Generate Missing MP4 Videos

on:
  # Weekly, an hour before the Monday traffic digest that COUNTS the holes.
  # This was workflow_dispatch only, which meant a strip published without a
  # video stayed without one until a human noticed and pressed a button. Four
  # did exactly that between 28 Aug and 7 Sep 2026 while ElevenLabs was
  # unpaid, and nothing was going to fill them in even after the invoice
  # cleared: retry-uploads only UPLOADS an mp4 that already exists, it does
  # not render one.
  #
  # Cheap when there is nothing to do: generate_all skips every date whose
  # mp4 is already on disk, so a healthy week makes no TTS calls at all.
  # Weekly rather than daily on purpose, because while TTS is down this run
  # fails loudly, and a daily red tick is the kind of alarm people learn to
  # scroll past.
  schedule:
    # Monday 06:30 UTC = 12:00 IST, ahead of the 13:00 IST weekly digest.
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: pipeline/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r pipeline/requirements.txt
          playwright install chromium --with-deps
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Generate missing videos
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python pipeline/video_generator.py --all

      - name: Commit and push
        run: |
          git config user.name "Lotus Lane Bot"
          git config user.email "bot@thelotuslane.in"
          git add shorts/ strips.json
          if git diff --staged --quiet; then
            echo "No new videos generated"
          else
            git commit -m "generate missing MP4 videos"
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git pull --rebase origin main
            git push
          fi
