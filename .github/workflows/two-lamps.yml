name: Two Lamps — weekly dialogue

# Picks one event from the week's news, writes the Iqbal × Ikeda dialogue,
# and publishes it to BOTH iqbalforall.org and thelotuslane.in, then emails
# Rahul the result. See pipeline/generate_two_lamps.py.

on:
  schedule:
    # Sunday 15:30 UTC = 21:00 IST (Sunday night)
    - cron: '30 15 * * 0'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Generate and print only — no commit, push, or email'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout lotus-lane
        uses: actions/checkout@v4

      - name: Clone iqbal-for-all
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          git clone --depth 1 \
            https://x-access-token:${GH_PAT}@github.com/zombielabsv2/iqbal-for-all.git \
            _iqbal

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install 'httpx>=0.25.0'

      - name: Generate the dialogue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python pipeline/generate_two_lamps.py --iqbal-dir _iqbal --lotus-dir . --dry-run
          else
            python pipeline/generate_two_lamps.py --iqbal-dir _iqbal --lotus-dir .
          fi

      - name: Commit & push lotus-lane
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html two-lamps/index.html
          if git diff --cached --quiet; then
            echo "No lotus-lane changes — skipping."
          else
            git pull --rebase --autostash origin main
            git commit -m "Two Lamps: weekly dialogue"
            git push
          fi

      - name: Commit & push iqbal-for-all
        if: ${{ inputs.dry_run != true }}
        run: |
          cd _iqbal
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/two-lamps.ts
          if git diff --cached --quiet; then
            echo "No iqbal-for-all changes — skipping."
          else
            git pull --rebase --autostash origin main
            git commit -m "Two Lamps: weekly dialogue"
            git push
          fi
